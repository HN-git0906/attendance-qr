<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>出欠QR</title>

</head>


<body>


  <!-- QRカメラ -->

  <div
    id="reader"
    style="width:340px;"
  ></div>


  <!-- iOSで音を有効化 -->

  <button id="sound">
    Sound ON (iOS)
  </button>


  <!-- 結果表示 -->

  <div id="result"></div>


  <!-- Menuシート -->

  <select
    id="menu"
    onchange="CURRENT_TEXT = '';"
  >

    <option>
      メニュー読込中...
    </option>

  </select>


  <!-- QRライブラリ -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


<script>


/*
 * ==================================================
 * Apps Script WebアプリURL
 * ==================================================
 *
 * /exec まで含めて指定する
 */

const API_URL =
  'https://script.google.com/a/macros/hi-tech.ac.jp/s/AKfycbwg76NLu-Myta4t2NlQTBGtMNq7dq2J5I7ZmK2b_3XGQs0Ckps-xkIQuhKMLTmcHO3F/exec';



/*
 * ==================================================
 * 基本設定
 * ==================================================
 */

let CURRENT_TEXT = '';



/*
 * ==================================================
 * PIN
 * ==================================================
 *
 * GitHubにはPINを書かない。
 * ページを開いた際に入力する。
 */

let API_PIN =
  sessionStorage
    .getItem(
      'attendancePin'
    ) || '';


if (!API_PIN) {

  API_PIN =
    prompt(
      '出欠管理PINを入力してください'
    ) || '';

  if (API_PIN) {

    sessionStorage
      .setItem(
        'attendancePin',
        API_PIN
      );
  }
}



/*
 * ==================================================
 * 画面表示
 * ==================================================
 */

const append = (text) => {

  document
    .querySelector(
      '#result'
    )
    .innerHTML +=
      `${text}<br>`;
};



/*
 * ==================================================
 * JSONP通信
 * ==================================================
 *
 * Menu取得と保存確認に使用
 */

function jsonp(params) {

  return new Promise(
    (resolve, reject) => {


      const callbackName =
        'cb_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      params.callback =
        callbackName;


      const script =
        document
          .createElement(
            'script'
          );


      const url =
        API_URL +
        '?' +
        new URLSearchParams(
          params
        ).toString();


      /*
       * 10秒でタイムアウト
       */

      const timeout =
        setTimeout(
          () => {

            delete window[
              callbackName
            ];

            script.remove();

            reject(
              new Error(
                '通信タイムアウト'
              )
            );

          },
          10000
        );


      /*
       * Apps Scriptから
       * JSONPが返ってきた場合
       */

      window[
        callbackName
      ] = function(data) {

        clearTimeout(
          timeout
        );

        delete window[
          callbackName
        ];

        script.remove();

        resolve(
          data
        );
      };


      /*
       * 通信自体が失敗
       */

      script.onerror =
        function() {

          clearTimeout(
            timeout
          );

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              '通信エラー'
            )
          );
        };


      script.src =
        url;


      document.body
        .appendChild(
          script
        );
    }
  );
}



/*
 * ==================================================
 * Menuシート取得
 * ==================================================
 */

async function loadMenus() {

  const select =
    document
      .querySelector(
        '#menu'
      );


  try {

    const data =
      await jsonp({

        action:
          'menus',

        pin:
          API_PIN
      });


    if (!data.ok) {

      throw new Error(
        data.error ||
        'メニュー取得失敗'
      );
    }


    select.innerHTML =
      '';


    data.menus
      .forEach(
        menu => {

          const option =
            document
              .createElement(
                'option'
              );

          option.value =
            menu;

          option.textContent =
            menu;

          select
            .appendChild(
              option
            );
        }
      );


    select.dataset.ready =
      '1';


    append(
      'メニューを読み込みました'
    );


  } catch (error) {

    select.innerHTML =
      '<option>メニュー取得失敗</option>';


    append(
      'メニュー取得失敗: ' +
      error.message
    );


    if (
      String(
        error.message
      ).includes(
        'PIN'
      )
    ) {

      sessionStorage
        .removeItem(
          'attendancePin'
        );
    }
  }
}



/*
 * ==================================================
 * requestId作成
 * ==================================================
 */

function makeRequestId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto
      .randomUUID();
  }


  return (
    Date.now()
      .toString(36) +

    '_' +

    Math.random()
      .toString(36)
      .slice(2)
  );
}



/*
 * ==================================================
 * QRをApps Scriptへ送信
 * ==================================================
 */

async function sendScan(
  decodedText,
  menu
) {


  const requestId =
    makeRequestId();


  /*
   * POST用データ
   */

  const body =
    new URLSearchParams({

      action:
        'scan',

      pin:
        API_PIN,

      requestId:
        requestId,

      text:
        decodedText,

      menu:
        menu
    });


  /*
   * Apps ScriptへPOST
   *
   * 応答内容自体は読まない。
   * 実際に保存されたかは後でstatus確認する。
   */

  try {

    await fetch(
      API_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        body:
          body
      }
    );


  } catch (error) {

    append(
      '送信失敗: ' +
      decodedText
    );

    CURRENT_TEXT =
      '';

    return;
  }


  /*
   * ==================================================
   * 保存されたか確認
   * ==================================================
   *
   * 最大約10秒確認する
   */

  for (
    let i = 0;
    i < 20;
    i++
  ) {


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );


    try {

      const status =
        await jsonp({

          action:
            'status',

          pin:
            API_PIN,

          requestId:
            requestId
        });


      if (
        status.ok
      ) {

        append(
          '保存完了: ' +
          decodedText
        );

        return;
      }


    } catch (error) {

      /*
       * 一時的な通信失敗は
       * 次の確認へ
       */
    }
  }


  /*
   * 最後まで確認できなかった
   */

  append(
    '保存確認できません: ' +
    decodedText
  );


  /*
   * 同じQRを再度読めるようにする
   */

  CURRENT_TEXT =
    '';
}



/*
 * ==================================================
 * QR読取成功
 * ==================================================
 */

const onScanSuccess =
  (
    decodedText,
    decodedResult
  ) => {


    console.log(
      'onScanSuccess',
      decodedText,
      CURRENT_TEXT
    );


    /*
     * 同じQRを連続で
     * 何度も読むのを防止
     */

    if (
      CURRENT_TEXT ===
      decodedText
    ) {

      return;
    }


    /*
     * Menu取得前なら保存しない
     */

    const menuSelect =
      document
        .querySelector(
          '#menu'
        );


    if (
      menuSelect.dataset.ready !==
      '1'
    ) {

      append(
        'メニューをまだ取得できていません'
      );

      return;
    }


    CURRENT_TEXT =
      decodedText;


    /*
     * 読取値を表示
     */

    append(
      decodedText
    );


    /*
     * 音
     */

    beep();


    /*
     * 選択中のMenu
     */

    const menu =
      menuSelect.value;


    /*
     * Spreadsheetへ送信
     */

    sendScan(
      decodedText,
      menu
    );
  };



/*
 * ==================================================
 * QR Scanner
 * ==================================================
 *
 * 元の方式と同じ
 */

const html5QrcodeScanner =
  new Html5QrcodeScanner(

    'reader',

    {

      fps:
        10,

      qrbox:
        240
    }
  );


html5QrcodeScanner
  .render(
    onScanSuccess
  );



/*
 * ==================================================
 * ビープ音
 * ==================================================
 *
 * iPhone Safariでは
 * 最初にユーザー操作が必要なので
 * Sound ONボタンを残す。
 */

let AUDIO_CONTEXT =
  null;


function enableSound() {

  if (
    !AUDIO_CONTEXT
  ) {

    AUDIO_CONTEXT =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  if (
    AUDIO_CONTEXT.state ===
    'suspended'
  ) {

    AUDIO_CONTEXT
      .resume();
  }


  beep();
}



function beep() {

  if (
    !AUDIO_CONTEXT
  ) {

    return;
  }


  const oscillator =
    AUDIO_CONTEXT
      .createOscillator();


  const gain =
    AUDIO_CONTEXT
      .createGain();


  oscillator
    .connect(
      gain
    );


  gain
    .connect(
      AUDIO_CONTEXT.destination
    );


  oscillator.frequency.value =
    1000;


  gain.gain.value =
    0.15;


  oscillator.start();


  oscillator.stop(
    AUDIO_CONTEXT.currentTime +
    0.08
  );
}



document
  .querySelector(
    '#sound'
  )
  .addEventListener(
    'click',
    enableSound
  );



/*
 * ==================================================
 * 初期化
 * ==================================================
 */

loadMenus();


</script>


</body>

</html>
