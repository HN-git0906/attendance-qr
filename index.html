<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>出欠QR</title>
</head>

<body>

  <!-- QRカメラ -->
  <div id="reader" style="width:340px;"></div>

  <!-- iOSで音を有効にする -->
  <button id="sound">
    Sound ON (iOS)
  </button>

  <!-- 読取・保存結果 -->
  <div id="result"></div>

  <!-- Menuシートから取得 -->
  <select
    id="menu"
    onchange="CURRENT_TEXT = '';"
  >
    <option>メニュー読込中...</option>
  </select>


  <!-- QRライブラリ -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <script>

    /*
     * =========================================
     * Apps Script WebアプリURL
     * =========================================
     *
     * デプロイ後の /exec URL に変更する
     *
     * 例:
     * https://script.google.com/macros/s/XXXXXXXX/exec
     */

    const API_URL =
      'https://script.google.com/a/macros/hi-tech.ac.jp/s/AKfycbwmQruJPj3yznz3iNn93T9T7mRbp1zvvbHxPijljVt-c2DhrsQbMcm1aRFkgTox8ft-5A/exec';


    /*
     * =========================================
     * 基本設定
     * =========================================
     */

    let CURRENT_TEXT = '';

    const PENDING = new Map();


    /*
     * PIN
     *
     * GitHub上には保存しない。
     * Safariを閉じるまではsessionStorageに保持する。
     */

    let API_PIN =
      sessionStorage.getItem('attendancePin') || '';

    if (!API_PIN) {

      API_PIN =
        prompt('出欠管理PINを入力してください') || '';

      if (API_PIN) {
        sessionStorage.setItem(
          'attendancePin',
          API_PIN
        );
      }
    }


    /*
     * =========================================
     * 画面にメッセージを追加
     * =========================================
     */

    const append = (text) => {

      document
        .querySelector('#result')
        .innerHTML += `${text}<br>`;
    };


    /*
     * =========================================
     * Apps ScriptへPOST
     * =========================================
     *
     * GitHub Pagesからgoogle.script.runは
     * 使用できないため、hidden formを使う。
     */

    function sendRequest(
      action,
      data = {}
    ) {

      const requestId =
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      /*
       * 返信を受けるための
       * 非表示iframe
       */

      const iframe =
        document.createElement('iframe');

      iframe.name =
        'post_' + requestId;

      iframe.style.display =
        'none';

      document.body
        .appendChild(iframe);


      /*
       * POSTフォーム
       */

      const form =
        document.createElement('form');

      form.method =
        'POST';

      form.action =
        API_URL;

      form.target =
        iframe.name;

      form.style.display =
        'none';


      const values = {

        action: action,

        pin: API_PIN,

        requestId: requestId,

        ...data
      };


      Object
        .entries(values)
        .forEach(
          ([key, value]) => {

            const input =
              document.createElement('input');

            input.type =
              'hidden';

            input.name =
              key;

            input.value =
              value;

            form.appendChild(
              input
            );
          }
        );


      document.body
        .appendChild(form);


      /*
       * 応答待ちとして記録
       */

      PENDING.set(
        requestId,
        {
          iframe: iframe,
          form: form,
          action: action,
          text: data.text || ''
        }
      );


      /*
       * Apps Scriptへ送信
       */

      form.submit();


      /*
       * 15秒でタイムアウト
       */

      setTimeout(
        () => {

          if (
            PENDING.has(
              requestId
            )
          ) {

            const pending =
              PENDING.get(
                requestId
              );

            append(
              '通信タイムアウト'
            );

            pending.form.remove();
            pending.iframe.remove();

            PENDING.delete(
              requestId
            );

            /*
             * 再読取可能にする
             */

            if (
              pending.action ===
              'scan'
            ) {
              CURRENT_TEXT = '';
            }
          }

        },
        15000
      );
    }


    /*
     * =========================================
     * Apps Scriptからの応答
     * =========================================
     */

    window.addEventListener(
      'message',
      function(event) {

        const data =
          event.data;


        /*
         * 出欠QR APIからの
         * メッセージだけ処理
         */

        if (
          !data ||
          data.source !==
            'attendance-qr' ||
          !data.requestId
        ) {
          return;
        }


        const pending =
          PENDING.get(
            data.requestId
          );


        if (!pending) {
          return;
        }


        /*
         * 使用済みフォーム等を削除
         */

        pending.form.remove();
        pending.iframe.remove();

        PENDING.delete(
          data.requestId
        );


        /*
         * エラー
         */

        if (!data.ok) {

          append(
            'エラー: ' +
            data.error
          );


          /*
           * QRの場合は
           * もう一度読めるようにする
           */

          if (
            pending.action ===
            'scan'
          ) {
            CURRENT_TEXT = '';
          }


          /*
           * PINが違う場合
           */

          if (
            data.error ===
            'PINが違います'
          ) {

            sessionStorage
              .removeItem(
                'attendancePin'
              );

            alert(
              'PINが違います。\nページを再読み込みしてください。'
            );
          }

          return;
        }


        /*
         * -------------------------
         * Menu取得成功
         * -------------------------
         */

        if (
          data.action ===
          'menus'
        ) {

          const select =
            document
              .querySelector(
                '#menu'
              );

          select.innerHTML =
            '';


          data.menus
            .forEach(
              menu => {

                const option =
                  document
                    .createElement(
                      'option'
                    );

                option.textContent =
                  menu;

                option.value =
                  menu;

                select.appendChild(
                  option
                );
              }
            );


          append(
            'メニューを読み込みました'
          );

          return;
        }


        /*
         * -------------------------
         * QR保存成功
         * -------------------------
         */

        if (
          data.action ===
          'scan'
        ) {

          append(
            `保存完了: ${pending.text}`
          );
        }
      }
    );


    /*
     * =========================================
     * QR読取成功時
     * =========================================
     */

    const onScanSuccess =
      (
        decodedText,
        decodedResult
      ) => {

        console.log(
          'onScanSuccess',
          decodedText,
          CURRENT_TEXT
        );


        /*
         * 同じQRの連続読取を防止
         */

        if (
          CURRENT_TEXT !==
          decodedText
        ) {

          CURRENT_TEXT =
            decodedText;


          /*
           * 元コードと同様、
           * 読み取った値を表示
           */

          append(
            decodedText
          );


          /*
           * 音
           */

          beep();


          /*
           * 選択中のMenu
           */

          const menu =
            document
              .querySelector(
                '#menu'
              )
              .value;


          /*
           * Apps Scriptへ送信
           */

          sendRequest(
            'scan',
            {
              text:
                decodedText,

              menu:
                menu
            }
          );
        }
      };


    /*
     * =========================================
     * QRスキャナー
     * =========================================
     *
     * 元コードとほぼ同じ。
     */

    const html5QrcodeScanner =
      new Html5QrcodeScanner(
        'reader',
        {
          fps: 10,
          qrbox: 240
        }
      );

    html5QrcodeScanner.render(
      onScanSuccess
    );


    /*
     * =========================================
     * ビープ音
     * =========================================
     *
     * 元コードをそのまま利用。
     */

    const AUDIO =
      new Audio();

    AUDIO.autoplay =
      true;


    const beep = () => {

      AUDIO.src =
        DATA_URL;
    };


    /*
     * iOS Safariでは、
     * 最初にユーザー操作が必要になる。
     */

    document
      .querySelector(
        '#sound'
      )
      .addEventListener(
        'click',
        () => {
          beep();
        }
      );


    /*
     * =========================================
     * 初回 Menu取得
     * =========================================
     */

    sendRequest(
      'menus'
    );

  </script>

</body>
</html>
